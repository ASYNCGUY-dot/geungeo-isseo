# docker compose run --rm verify   # full reproducible run without network
# docker compose up web            # web app on http://127.0.0.1:8000/
services:
  verify:
    build: .
    image: geungeo-isseo:local
    command: ["python", "scripts/reproduce.py", "--output-dir", "/tmp/reproduce"]
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/c003-products.jsonl:/app/data/c003-products.jsonl:ro

  web:
    build: .
    image: geungeo-isseo:local
    command:
      - python
      - scripts/serve_api.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --source-retrieved-at
      - "2026-08-27T12:42:29.050550+00:00"
    # The API has no authentication: publish it on the host loopback only.
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/c003-products.jsonl:/app/data/c003-products.jsonl:ro
